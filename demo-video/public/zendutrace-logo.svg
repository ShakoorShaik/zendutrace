<?xml version="1.0"?>
<svg width="420" height="96" viewBox="0 0 420 96" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    

    <linearGradient id="c-path-grad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0"></stop>
      <stop offset="50%" stop-color="#00C4FF" stop-opacity="0.55"></stop>
      <stop offset="100%" stop-color="#00C4FF" stop-opacity="1"></stop>
    </linearGradient>

    <linearGradient id="c-dot-fill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4AAEED"></stop>
      <stop offset="100%" stop-color="#00B8F0"></stop>
    </linearGradient>

    <radialGradient id="c-dot-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C4FF" stop-opacity="0.4"></stop>
      <stop offset="100%" stop-color="#00C4FF" stop-opacity="0"></stop>
    </radialGradient>

    <filter id="c-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
    <filter id="c-path-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6" result="blur"></feGaussianBlur>
      <feMerge><feMergeNode in="blur"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge>
    </filter>
  </defs>


  
  <rect x="12" y="12" width="72" height="72" rx="16" fill="#0F1525" stroke="rgba(0,196,255,0.28)" stroke-width="1.2"></rect>

  
  <g transform="translate(22.3, 22.2) scale(1.117)">

    
    <circle cx="48" cy="20" r="19" fill="url(#c-dot-halo)"></circle>

    
    <path d="M 6 54 C 6 32 32 6 48 20" stroke="url(#c-path-grad)" stroke-width="2.2" fill="none" stroke-linecap="round" filter="url(#c-path-glow)"></path>

    
    <circle cx="9" cy="50" r="1.4" fill="#00C4FF" opacity="0.22"></circle>
    <circle cx="14" cy="42" r="1.5" fill="#00C4FF" opacity="0.36"></circle>
